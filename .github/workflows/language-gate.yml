# =============================================================================
#  The language gate with the rules of the BASE (entry W3.1-bis.1)
# =============================================================================
#
#  tests.yml runs the language gate too, but on a pull request tests.yml, the
#  gate script and the detector all come from the pull request: a pull
#  request could switch the gate off by editing them. Here the trigger is
#  pull_request_target, so this file and the checkout are the ones of the
#  target branch. The gate script of the base fetches the merge commit of the
#  pull request and judges it from the object store, against zero outside the
#  signed exceptions, with the detector of the BASE; a change to the detector,
#  the lexicon or the exceptions needs the trailer
#  "Language-Gate-Config-Change:".
#
#  pull_request_target runs with the target branch's token. This job asks
#  for `contents: read` only and uses no secret: it runs the detector of the
#  base, and reads the pull request's files as data.
#
#  Branch protection should require this check (and CODEOWNERS covers
#  .github/ and Checks/language/): a gate that can be merged red is a sign.
# =============================================================================

name: language-gate

on:
  pull_request_target:

permissions:
  contents: read

jobs:
  base-rules:
    runs-on: windows-latest

    steps:

      - name: Checkout of the target branch
        uses: actions/checkout@v4
        with:
          # the token (read-only here) stays: the repository is private and
          # the gate fetches the merge commit of the pull request with it
          fetch-depth: 0

      - name: Language gate (rules of the base)
        shell: pwsh
        run: .\.github\steps\language-gate.ps1 -FetchPullRequest ${{ github.event.pull_request.number }}
