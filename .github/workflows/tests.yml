# =============================================================================
#  The checks that a machine without SOLIDWORKS can really do  (entries F9, F9-bis)
# =============================================================================
#
#  THIS FILE WAS REWRITTEN ON 23/9/2026 BECAUSE IT COULD NOT TURN GREEN,
#  AND NEVER HAD.
#
#  The previous draft began with `msbuild Oce.Solid.Agent.csproj`. That
#  project — and `Oce.Solid.Agent.Core`, which sits under it — references
#  `SolidWorks.Interop.sldworks` and `SolidWorks.Interop.swconst` with a
#  `HintPath` inside the SOLIDWORKS installation. No GitHub runner has
#  that folder, and the interops belong to Dassault: they can be neither put
#  in the repository nor downloaded.
#
#  MEASURED, NOT DEDUCED. Building locally with
#  `/p:SwInstallPath=Z:\does-not-exist` gives two hundred and some errors
#  `CS0246: il nome di tipo o di spazio dei nomi 'IModelDoc2' non e' stato
#  trovato`. The first step always failed, so the two useful steps — the contract
#  checks and the refusal of a delivery without a bench run — were
#  never reached.
#
#  Meanwhile the README said «the CI builds, runs the contract checks and
#  refuses a delivery in which nobody has run the bench». True on paper,
#  unreachable in practice. **A CI that has never run is a badge,
#  not a proof** — and it is exactly the defect this repository
#  blames on others.
#
#  ── AND THE POWERSHELL LIVES IN FILES, NOT IN HERE ─────────────────────────
#
#  The `pwsh` steps call `.github\steps\*.ps1`. Code inside a YAML that
#  nobody executes is the same defect of this entry moved up one level:
#  a syntax error would be found on the first run, that is, never. In a
#  `.ps1` it is caught by `Checks\check-workflow.ps1`, which runs locally, and
#  every step can be launched by hand.
#
#  ── WHAT IT DOES NOW ───────────────────────────────────────────────────────
#
#    0. the language gate (entry W3.1-bis.1): the Italian in the repository
#       may go down, never up. Every commit of the range is judged against
#       its own parent, with the parent's detector, lexicon and exceptions; a
#       raise needs the trailer "Language-Baseline-Raise:" on the commit that
#       raises, a change to the gate "Language-Gate-Config-Change:". It needs
#       only Node, so it runs first. On a pull request the same script also
#       runs from language-gate.yml (pull_request_target), where the copy of
#       the BASE judges: this file comes from the pull request itself;
#    1. checks whether the Dassault interop is on this runner;
#    2. builds the bridge ONLY if it is (on GitHub it is not; on a
#       self-hosted runner with SOLIDWORKS installed it is, and then it really builds it);
#    3. builds `Tests\Oce.Solid.Agent.ContractTests.csproj`, which has no interop —
#       and there is a check inside the suite that verifies exactly this;
#    4. runs `Oce.Solid.Agent.ContractTests.exe`.
#
#  ── AND WHAT THE SUITE DOES WHEN THE BRIDGE IS NOT THERE ───────────────────
#
#  It does not skip in silence. The groups that need the executable of the bridge
#  — the MCP protocol, `Session.SameDocument`, the catalog exporter,
#  the comparison between the two libraries — write an entry **«not runnable
#  here»**, which is counted apart, printed and ends up in `results.xml` as
#  `<skipped>`. The summary line of the suite says `N checks, 0 failed, M not runnable here
#  (K really done)`, and the declared minimum is measured on the **facts**: a
#  suite that is all skipped does not pass the threshold.
#
#  What can be done without SOLIDWORKS is done all the same, and it is not
#  little: the evaluator of the expectations, the sources that live in their `.csproj`,
#  the documents that count the right files, the content of the catalog (read from
#  `Tools\catalog.json`, which is in the repository), and the refusal of a
#  delivery in which nobody has run the bench.
#
#  ── AND WHAT THIS DOES NOT PROVE (entry K4, 18/9/2026, still valid) ────────
#
#  The check on the bench is NOT an independent verification.
#  `Bench/report/last.json` is a file that **we produce and commit
#  ourselves**: the CI checks that it declares a whole run, consistent with the
#  current library and later than the last change to the operations. It is a guard
#  against OUR own distraction — the commit made without having rerun the
#  bench — not against a bench that lied. If the report said something false,
#  the CI would believe it.
#
#  The only thing that would make that point a real verification is a runner with
#  SOLIDWORKS, and there is none.
# =============================================================================

name: tests

on:
  push:
    branches: [ main ]
    # a release tag: the language gate wants the category transition at 0
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:
    inputs:
      base:
        description: 'Language gate: judge the commits after this one (default: the parent of the head)'
        required: false
        default: ''

jobs:
  contracts:
    runs-on: windows-latest

    steps:

      - name: Check out the code
        uses: actions/checkout@v4
        with:
          # The check «the bench is later than the last change to the
          # operations» asks git when `Oce.Solid.Agent.Core` was
          # last touched: with a shallow clone that date does not exist.
          fetch-depth: 0

      # The language gate (entry W3.1-bis.1). The base is the commit before a
      # push, or the "base" input of a manual run; on a pull request the
      # script takes the first parent of the merge commit (the target branch
      # as it is now). Without any of them: the parent of the head.
      - name: Language gate
        shell: pwsh
        env:
          LANGUAGE_GATE_BASE: ${{ github.event.before || inputs.base }}
        run: .\.github\steps\language-gate.ps1

      - name: MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Is the Dassault interop on this runner?
        id: interop
        shell: pwsh
        run: .\.github\steps\interop-is-there.ps1

      - name: Build the bridge (only where the interop is)
        if: steps.interop.outputs.found == 'yes'
        run: msbuild Oce.Solid.Agent.csproj -p:Configuration=Release -v:m

      - name: Build the contract tests
        run: msbuild Tests\Oce.Solid.Agent.ContractTests.csproj -p:Configuration=Release -v:m

      - name: The executables really exist
        shell: pwsh
        run: .\.github\steps\executables-exist.ps1 -InteropIsThere '${{ steps.interop.outputs.found }}'

      - name: Run the contract tests
        run: Tests\bin\Oce.Solid.Agent.ContractTests.exe

      - name: How much of this run could not run
        if: always()
        shell: pwsh
        run: .\.github\steps\how-much-did-not-run.ps1

      - name: Upload results.xml
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results.xml
          path: Tests/bin/results.xml
          if-no-files-found: error
