# =============================================================================
#  Le prove che una macchina senza SOLIDWORKS puo' davvero fare  (voci F9, F9-bis)
# =============================================================================
#
#  QUESTO FILE E' STATO RISCRITTO IL 23/9/2026 PERCHE' NON POTEVA DIVENTARE
#  VERDE, E NON L'AVEVA MAI FATTO.
#
#  La stesura precedente cominciava con `msbuild Oce.Solid.Agent.csproj`. Quel
#  progetto — e `Oce.Solid.Agent.Core`, che gli sta sotto — referenzia
#  `SolidWorks.Interop.sldworks` e `SolidWorks.Interop.swconst` con un
#  `HintPath` dentro l'installazione di SOLIDWORKS. Nessun runner di GitHub ha
#  quella cartella, e le interop sono di Dassault: non si possono mettere in
#  repository ne' scaricare.
#
#  MISURATO, NON DEDOTTO. Compilando in locale con
#  `/p:SwInstallPath=Z:\non-esiste` escono duecento e passa errori
#  `CS0246: il nome di tipo o di spazio dei nomi 'IModelDoc2' non e' stato
#  trovato`. Il primo passo falliva sempre, quindi i due passi utili — le prove
#  di contratto e il rifiuto di una consegna senza banco — non venivano
#  raggiunti mai.
#
#  Il README intanto diceva «la CI compila, lancia i controlli di contratto e
#  rifiuta una consegna in cui nessuno ha lanciato il banco». Vero sulla carta,
#  irraggiungibile in pratica. **Una CI che non e' mai girata e' un distintivo,
#  non una prova** — ed e' esattamente il difetto che questo repository
#  rimprovera altrove.
#
#  ── E IL POWERSHELL STA IN FILE, NON QUI DENTRO ────────────────────────────
#
#  I passi in `pwsh` chiamano `.github\steps\*.ps1`. Codice dentro un YAML che
#  nessuno esegue e' lo stesso difetto di questa voce spostato di un livello:
#  un errore di sintassi si scoprirebbe alla prima corsa, cioe' mai. In un
#  `.ps1` lo prende `Checks\check-workflow.ps1`, che gira in locale, e
#  ogni passo si puo' lanciare a mano.
#
#  ── COSA FA ADESSO ─────────────────────────────────────────────────────────
#
#    0. the language gate (entry W3.1-bis.1): the Italian in the repository
#       may go down, never up. Every commit of the range is judged against
#       its own parent, with the parent's detector, lexicon and exceptions; a
#       raise needs the trailer "Language-Baseline-Raise:" on the commit that
#       raises, a change to the gate "Language-Gate-Config-Change:". It needs
#       only Node, so it runs first. On a pull request the same script also
#       runs from language-gate.yml (pull_request_target), where the copy of
#       the BASE judges: this file comes from the pull request itself;
#    1. guarda se l'interop di Dassault c'e' su questo runner;
#    2. compila il ponte SOLO se c'e' (su GitHub non c'e'; su un runner
#       self-hosted con SOLIDWORKS installato si', e allora lo compila davvero);
#    3. compila `Tests\Oce.Solid.Agent.ContractTests.csproj`, che di interop non ne ha —
#       e c'e' un controllo dentro la suite che verifica proprio questo;
#    4. lancia `Oce.Solid.Agent.ContractTests.exe`.
#
#  ── E COSA LA SUITE FA, QUANDO IL PONTE NON C'E' ───────────────────────────
#
#  Non salta in silenzio. I gruppi che hanno bisogno dell'eseguibile del ponte
#  — il protocollo MCP, `Sessione.StessoDocumento`, l'esportatore del catalogo,
#  il confronto fra le due librerie — scrivono una voce **«non eseguibile
#  qui»**, che si conta a parte, si stampa e finisce in `prove.xml` come
#  `<skipped>`. Il riepilogo dice `N controlli, 0 falliti, M non eseguibili qui
#  (K fatti davvero)`, e il minimo dichiarato si misura sui **fatti**: una
#  suite tutta saltata non supera la soglia.
#
#  Quello che invece si puo' fare senza SOLIDWORKS si fa lo stesso, e non e'
#  poco: il valutatore delle attese, i sorgenti che stanno nei loro `.csproj`,
#  i documenti che contano i file giusti, il contenuto del catalogo (letto da
#  `Tools\catalog.json`, che sta in repository), e il rifiuto di una
#  consegna in cui nessuno ha lanciato il banco.
#
#  ── E COSA QUESTO NON PROVA (voce K4, 18/9/2026, ancora valida) ────────────
#
#  Il controllo sul banco NON e' una verifica indipendente.
#  `Bench/report/last.json` e' un file che **produciamo e committiamo
#  noi**: la CI controlla che dichiari un giro intero, coerente con la libreria
#  di adesso e posteriore all'ultima modifica alle operazioni. E' una guardia
#  contro la NOSTRA distrazione — il commit fatto senza aver rilanciato il
#  banco — non contro un banco che mentisse. Se il resoconto dicesse il falso,
#  la CI lo crederebbe.
#
#  L'unica cosa che renderebbe quel punto una verifica vera e' un runner con
#  SOLIDWORKS, e non c'e'.
# =============================================================================

name: prove

on:
  push:
    branches: [ main ]
    # a release tag: the language gate wants the category transition at 0
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:
    inputs:
      base:
        description: 'Language gate: judge the commits after this one (default: the parent of the head)'
        required: false
        default: ''

jobs:
  contratti:
    runs-on: windows-latest

    steps:

      - name: Prendi il codice
        uses: actions/checkout@v4
        with:
          # La prova «il banco e' posteriore all'ultima modifica alle
          # operazioni» chiede a git quando `Oce.Solid.Agent.Core` e' stato
          # toccato: con un clone superficiale quella data non esiste.
          fetch-depth: 0

      # The language gate (entry W3.1-bis.1). The base is the commit before a
      # push, or the "base" input of a manual run; on a pull request the
      # script takes the first parent of the merge commit (the target branch
      # as it is now). Without any of them: the parent of the head.
      - name: Language gate
        shell: pwsh
        env:
          LANGUAGE_GATE_BASE: ${{ github.event.before || inputs.base }}
        run: .\.github\steps\language-gate.ps1

      - name: MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: C'e' l'interop di Dassault su questo runner?
        id: interop
        shell: pwsh
        run: .\.github\steps\interop-is-there.ps1

      - name: Compila il ponte (solo dove l'interop c'e')
        if: steps.interop.outputs.ce == 'si'
        run: msbuild Oce.Solid.Agent.csproj -p:Configuration=Release -v:m

      - name: Compila le prove di contratto
        run: msbuild Tests\Oce.Solid.Agent.ContractTests.csproj -p:Configuration=Release -v:m

      - name: Gli eseguibili esistono davvero
        shell: pwsh
        run: .\.github\steps\executables-exist.ps1 -InteropCe '${{ steps.interop.outputs.ce }}'

      - name: Lancia le prove di contratto
        run: Tests\bin\Oce.Solid.Agent.ContractTests.exe

      - name: Quanto di questo giro non ha potuto girare
        if: always()
        shell: pwsh
        run: .\.github\steps\how-much-did-not-run.ps1

      - name: Pubblica prove.xml
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prove.xml
          path: Tests/bin/prove.xml
          if-no-files-found: error
